<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva Sign-up · Shri Krishna Bhakta Sabha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#172033;--indigo:#1B2A5C;--teal:#0F7C7A;--gold:#F2A900;--mist:#EEF4F6;--line:#C9D6DB;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Mukta',system-ui,sans-serif;color:var(--ink);background:var(--mist);line-height:1.55;font-size:17px}
header{background:var(--indigo);color:var(--white);padding:40px 20px 56px;text-align:center;border-bottom:6px solid var(--gold)}
header h1{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:clamp(28px,6vw,44px);margin:0 0 8px}
header p{margin:0 auto;max-width:34em;color:#D5DDF2}
main{max-width:760px;margin:-28px auto 60px;padding:0 16px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
h2{font-size:20px;margin:0 0 12px;color:var(--indigo)}
label.f{display:block;font-weight:600;margin-bottom:14px}
input[type=text],input[type=tel],textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:8px;background:var(--white)}
textarea{min-height:80px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sevas{display:grid;gap:10px}
.seva{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.seva input{width:22px;height:22px;margin-top:3px;accent-color:var(--teal);flex:none}
.seva b{display:block}
.seva span{font-size:15px;color:#4A566B}
.seva:has(input:checked){border-color:var(--teal);background:#E6F4F3}
.count{font-weight:600;color:var(--teal);margin:12px 0 0}
button{width:100%;padding:14px;font:inherit;font-weight:700;font-size:18px;color:var(--indigo);background:var(--gold);border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:14px;font-weight:600}
#msg.err{color:#B3261E}#msg.ok{color:var(--teal)}
@media (prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:scale(.98)}}
</style>
</head>
<body>
<header>
  <h1>Shri Krishna Bhakta Sabha</h1>
  <p>Choose the seva you would like to do. Select as many as you wish.</p>
</header>
<main>
<div class="panel" id="done" hidden>
  <h2>Thank you, <span id="who"></span>!</h2>
  <p>Your seva choices have been received. Hare Krishna!</p>
</div>
<form id="form" class="panel" novalidate>
  <h2>Your details</h2>
  <label class="f">Name<input type="text" id="name" autocomplete="name" required></label>
  <label class="f">Phone number (WhatsApp preferred)<input type="tel" id="phone" autocomplete="tel" inputmode="tel" required></label>

  <h2>Available seva</h2>
  <div class="sevas" id="sevas"></div>
  <p class="count" id="count" aria-live="polite">No seva selected yet</p>

  <label class="f" style="margin-top:18px">Anything else we should know? (optional)<textarea id="notes" placeholder="Preferred days, timings, skills..."></textarea></label>
  <button type="submit" id="go">Submit my seva choices</button>
  <div id="msg" role="status"></div>
</form>
</main>

<script>
/* ===== EDIT THIS SECTION ===== */
// Paste your Google Apps Script web app URL here (see Code.gs). Leave empty to test the page only.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvsF5QTrJLpE7PA9xywcXUuL9-MG8BlOKeEDYUIXGQ680IRS8WCt0wTYwNAs3vrwt0Wg/exec";

// Your seva list. Add, remove or rename freely.
const SEVAS = [
  {id:"gita",     name:"Gita Parayanam",             desc:"Recite or lead Bhagavad Gita chanting"},
  {id:"bhajan",   name:"Bhajan and kirtan",          desc:"Sing or play an instrument"},
  {id:"alankara", name:"Flowers and decoration",     desc:"Garlands, altar and hall decoration"},
  {id:"prasadam", name:"Prasadam preparation",       desc:"Cooking and preparing offerings"},
  {id:"serve",    name:"Prasadam distribution",      desc:"Serving devotees after satsang"},
  {id:"clean",    name:"Cleaning and setup",         desc:"Hall cleaning, mats, arranging seating"},
  {id:"sound",    name:"Sound and projection",       desc:"Mic, speakers, screen and recording"},
  {id:"welcome",  name:"Welcome and registration",   desc:"Greet newcomers and keep the attendance"}
];
/* ============================= */

const $ = id => document.getElementById(id);
const box = $("sevas");
SEVAS.forEach(s=>{
  const l = document.createElement("label");
  l.className = "seva";
  l.innerHTML = '<input type="checkbox" value="'+s.name+'"><div><b>'+s.name+'</b><span>'+s.desc+'</span></div>';
  box.appendChild(l);
});
function picked(){return [...box.querySelectorAll("input:checked")].map(i=>i.value)}
box.addEventListener("change",()=>{
  const n = picked().length;
  $("count").textContent = n ? n+" seva selected" : "No seva selected yet";
});

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg = $("msg"); msg.className = ""; msg.textContent = "";
  const name = $("name").value.trim(), phone = $("phone").value.trim(), sevas = picked();
  if(!name){msg.className="err";msg.textContent="Please enter your name.";$("name").focus();return}
  if(phone.replace(/\D/g,"").length < 10){msg.className="err";msg.textContent="Please enter a valid phone number.";$("phone").focus();return}
  if(!sevas.length){msg.className="err";msg.textContent="Please select at least one seva.";return}
  const data = {name, phone, sevas, notes:$("notes").value.trim()};
  $("go").disabled = true; $("go").textContent = "Submitting...";
  try{
    if(SCRIPT_URL){
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    }else{
      console.log("Test mode (no SCRIPT_URL set):",data);
    }
    $("who").textContent = name;
    $("form").hidden = true; $("done").hidden = false;
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    msg.className = "err";
    msg.textContent = "Could not submit. Please check your internet and try again.";
    $("go").disabled = false; $("go").textContent = "Submit my seva choices";
  }
});
</script>
</body>
</html>
